name: Vertex V2 Verification CI

on:
  pull_request:
    branches: [main, develop, "feature/*", "bugfix/*"]
  push:
    branches: ["feature/*", "bugfix/*"]

permissions:
  contents: read

jobs:
  verify-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify OpenAPI TypeScript types & build modular frontend
        run: |
          PYTHONPATH=src python scripts/export_openapi.py
          git diff --exit-code frontend/src/shared/api-types.ts
          PYTHONPATH=src python scripts/build_frontend.py
          find frontend/dist -name "*.js" -exec node --check {} +

      - name: Run v2 offline unit, integration, migration, contract, and e2e suites
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/unit
          PYTHONPATH=src python -m unittest discover -s tests/integration
          PYTHONPATH=src python -m unittest discover -s tests/migration
          PYTHONPATH=src python -m unittest discover -s tests/contracts
          PYTHONPATH=src python -m unittest discover -s tests/e2e

      - name: Build v2 container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.v2
          push: false
          load: false

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

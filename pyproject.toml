[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertex-game-hub"
version = "0.2.0"
description = "Self-hosted, private multi-account video game library tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
]

[project.scripts]
vertex = "vertex.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c101d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>

    <!-- Cyan-to-Blue Wing (Steam / Digital convergence) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Violet-to-Magenta Wing (PlayStation / Console convergence) -->
    <linearGradient id="violetGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Apex Core Convergence Glow -->
    <linearGradient id="coreGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Rim Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="8" y="8" width="184" height="184" rx="44" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>

  <!-- Subtle ambient inner glow -->
  <circle cx="100" cy="115" r="45" fill="#6366f1" opacity="0.12" filter="blur(16px)"/>

  <!-- Left Facet -->
  <polygon points="46,50 82,50 100,126 78,142 46,74" fill="url(#cyanGrad)" />

  <!-- Right Facet -->
  <polygon points="154,50 118,50 100,126 122,142 154,74" fill="url(#violetGrad)" />

  <!-- Center Convergence Chevron / Apex -->
  <polygon points="82,50 100,82 118,50 100,126" fill="#0f172a" opacity="0.75" />
  <polygon points="100,82 118,50 100,126" fill="url(#violetGrad)" opacity="0.4" />
  <polygon points="82,50 100,82 100,126" fill="url(#cyanGrad)" opacity="0.4" />

  <!-- Sharp Bottom Apex -->
  <polygon points="78,142 100,166 122,142 100,126" fill="#6366f1" />
  <polygon points="78,142 100,166 100,126" fill="#38bdf8" />

  <!-- Top Inner Accent Bevels -->
  <polygon points="46,50 82,50 74,62 54,62" fill="#bae6fd" opacity="0.7"/>
  <polygon points="154,50 118,50 126,62 146,62" fill="#f5d0fe" opacity="0.7"/>

  <!-- High-contrast Luminous Apex Spark -->
  <circle cx="100" cy="164" r="3" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
